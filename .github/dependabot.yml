# Workflow actions are pinned to commit SHAs (supply-chain safety); Dependabot
# keeps those pins current by opening a weekly PR with any updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Dev tooling (e.g. vitest, pinned exactly) gets security and patch updates
  # in one grouped weekly PR. Runtime dependencies are left to manual updates.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: development
    groups:
      dev-dependencies:
        dependency-type: development
