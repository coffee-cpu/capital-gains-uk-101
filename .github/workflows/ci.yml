name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Build CLI
        run: npm run build:cli

      - name: CLI smoke test
        # Runs the bundled binary on the HMRC HS284 example 3 fixture (GBP only, no network)
        run: |
          node packages/cli/dist/cli.js calculate e2e/fixtures/hmrc-hs284-example3.csv \
            --tax-year 2024/25 --offline --no-auto-splits --no-cache --strict --format json > cli-output.json
          node -e "
            const r = require('./cli-output.json')
            const net = r.taxYears[0].netGainOrLossGbp
            if (net !== 629.67) { console.error('Expected net gain 629.67, got', net); process.exit(1) }
            console.log('CLI smoke test passed: net gain', net)
          "

  e2e:
    name: E2E tests
    needs: build-and-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
