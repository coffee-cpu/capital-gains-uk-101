name: Monthly HMRC audit

# Runs the HMRC audit in docs/HMRC_AUDIT.md: the matching rules (worked-example
# and engine tests, HS284, the Capital Gains Manual pages, TCGA 1992) and every
# HMRC figure the engine uses. Claude does the checks and records them in the
# audit log; it moves HMRC_AUDIT_DATE (the date the app shows) only when
# everything matches. The workflow then opens a PR for a person to review and
# merge. Nothing is merged automatically.

on:
  schedule:
    # 1st of each month, 07:00 UTC
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: hmrc-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRANCH: chore/hmrc-audit
      GH_TOKEN: ${{ github.token }}
      # The audit's summary for the PR description (in the workspace, never committed)
      SUMMARY: .hmrc-audit-summary.md
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          # pdftotext, to read HMRC's PDFs (the HS284 Example 3 sheet, SA108 notes, SA100)
          sudo apt-get install -y poppler-utils

      - name: Run the audit
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Run the monthly HMRC audit of this repository (a UK capital gains calculator). Today's date
            is the date of the audit; use `date -u +%F`.

            Follow the checklist in docs/HMRC_AUDIT.md exactly: every matching-rules step and every row
            of the figures table, against the sources it names. Fetch the pages; read PDFs by downloading
            them with curl into /tmp and running pdftotext. Compare with the code and tests
            named in the checklist. Also look for anything new since the last audit in the log: a Budget
            or Finance Act changing an amount, a new SA108/SA100/HS284 edition, a changed rule. Re-check
            each open finding and say whether it still stands.

            Then record the audit in docs/HMRC_AUDIT.md, as the existing entries do: a new
            "### YYYY-MM-DD" entry at the top of "## Audits" saying what you checked against what and
            the result, and update "## Open findings".
            - If every check matches and every test passes: set HMRC_AUDIT_DATE in
              src/lib/cgt/hmrcAudit.ts to today's date (it must equal the new entry's heading).
            - If anything doesn't match, a test fails, or a source couldn't be read: do NOT change
              HMRC_AUDIT_DATE. Describe each problem in the entry and add it to open findings.
            Never change engine code, figures, tests or anything else to make a check pass: only
            docs/HMRC_AUDIT.md and that one date. Be factual and quote sources; don't guess.

            Finally write a short summary for the PR description to .hmrc-audit-summary.md. Its
            first line must be exactly "RESULT: PASS" (date moved) or "RESULT: NEEDS ATTENTION" (date
            not moved), followed by the findings as a markdown list.
          claude_args: |
            --model claude-opus-5-5 --allowedTools "Read,Glob,Grep,Edit,Write,WebFetch,WebSearch,Bash(date:*),Bash(curl:*),Bash(pdftotext:*),Bash(git grep:*),Bash(git log:*),Bash(npx playwright test:*),Bash(npx vitest run:*)"

      # PRs opened with GITHUB_TOKEN don't trigger the CI workflow, so check here
      - name: Build and tests
        run: |
          npm run build
          npm test

      - name: Open or update the PR
        run: |
          if git diff --quiet -- docs/HMRC_AUDIT.md src/lib/cgt/hmrcAudit.ts; then
            echo "The audit recorded nothing"; exit 1
          fi
          RESULT=$(head -n 1 "$SUMMARY" 2>/dev/null || echo "RESULT: NEEDS ATTENTION")
          if [ "$RESULT" = "RESULT: PASS" ]; then
            TITLE="HMRC audit $(date -u +%F): rules and figures match"
          else
            TITLE="HMRC audit $(date -u +%F): needs attention"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add docs/HMRC_AUDIT.md src/lib/cgt/hmrcAudit.ts
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          {
            cat "$SUMMARY" 2>/dev/null || echo "RESULT: NEEDS ATTENTION (the audit wrote no summary)"
            echo
            echo "Generated by \`.github/workflows/hmrc-audit.yml\`, which ran the build and unit tests before opening this PR. Merging it moves the date the app shows only if the audit passed."
            echo "CI doesn't run automatically on PRs opened by this workflow: close and reopen the PR to run it."
          } > "$RUNNER_TEMP/body.md"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi
