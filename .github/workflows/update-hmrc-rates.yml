name: Update bundled HMRC rates

# Rebuilds the HMRC exchange rates bundled with the app (src/lib/fx/data) from
# gov.uk, and opens or updates a PR when anything changed: a new month, a new
# yearly average, or a correction HMRC made to a published file. If the script
# finds a rate that looks like a typo it hasn't seen, the run fails so a person
# reviews it (add it to EXCLUDED or KEPT in scripts/vendor-hmrc-rates.mjs).

on:
  schedule:
    # Mondays 06:00 UTC. HMRC publishes each month's file shortly before it starts
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-hmrc-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH: chore/update-hmrc-rates
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild bundled rates
        run: node scripts/vendor-hmrc-rates.mjs --report "$RUNNER_TEMP/report.md"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- src/lib/fx/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Bundled rates are up to date"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/lib/fx/data
          fi

      # PRs opened with GITHUB_TOKEN don't trigger the CI workflow, so check here
      - name: Build and unit tests
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run build
          npm test
          npm run build:cli

      - name: Open or update the PR
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add src/lib/fx/data
          git commit -m "chore(fx): update bundled HMRC exchange rates"
          git push --force origin "$BRANCH"

          {
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "Generated by \`.github/workflows/update-hmrc-rates.yml\`, which ran the build, unit tests and CLI build before opening this PR."
            echo "CI doesn't run automatically on PRs opened by this workflow: close and reopen the PR to run it."
            echo
            echo "**Review any \"changed\" line**: it means HMRC changed a month that was already bundled."
          } > "$RUNNER_TEMP/body.md"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(fx): update bundled HMRC exchange rates" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
