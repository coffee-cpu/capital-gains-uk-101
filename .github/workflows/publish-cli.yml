name: Publish CLI to npm

# Publishes packages/cli (cgt-visualiser) when a tag like cli-v0.1.0 is pushed.
# The tag version must match packages/cli/package.json. Uses npm trusted
# publishing (OIDC), so no npm token is stored in the repository.

on:
  push:
    tags:
      - 'cli-v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm trusted publishing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install npm with OIDC support
        run: npm install -g npm@11.21.1  # pinned: 11.5.1+ needed for trusted publishing

      - run: npm ci

      - name: Verify version matches tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/cli-v}
          PACKAGE_VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match packages/cli/package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - run: npm test

      - run: npm run build:cli

      - name: CLI smoke test
        run: bash packages/cli/scripts/smoke-test.sh

      - run: npm publish -w packages/cli --provenance --access public
