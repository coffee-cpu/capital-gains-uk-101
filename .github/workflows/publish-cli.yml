name: Publish CLI to npm

# Publishes packages/cli (cgt-visualiser) when a tag like cli-v0.1.0 is pushed.
# The tag version must match packages/cli/package.json. Uses npm trusted
# publishing (OIDC), so no npm token is stored in the repository. After
# publishing, it creates a GitHub Release with notes generated from the PRs
# merged since the previous cli-v tag.

on:
  push:
    tags:
      - 'cli-v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install npm with OIDC support
        run: npm install -g npm@11.21.1  # pinned: 11.5.1+ needed for trusted publishing; Dependabot does not update this line

      - run: npm ci

      - name: Verify version matches tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/cli-v}
          PACKAGE_VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match packages/cli/package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - run: npm test

      - run: npm run build:cli

      - name: CLI smoke test
        run: bash packages/cli/scripts/smoke-test.sh

      - run: npm publish -w packages/cli --provenance --access public

  release:
    # Separate job so only this step gets write access to the repository.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Tags are needed to find the previous CLI release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#cli-v}
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          # Notes cover PRs merged since the previous CLI tag (other tags are ignored)
          PREVIOUS_TAG=$(git tag --list 'cli-v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1)
          NOTES="Published to npm as [\`cgt-visualiser@$VERSION\`](https://www.npmjs.com/package/cgt-visualiser/v/$VERSION)."
          gh release create "$TAG" \
            --verify-tag \
            --title "CLI $VERSION" \
            --notes "$NOTES" \
            --generate-notes \
            ${PREVIOUS_TAG:+--notes-start-tag "$PREVIOUS_TAG"}
